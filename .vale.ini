# The prose rules of ADR-0dd192525166, run by crates/ank-cli/tests/prose.rs
# through `mise x -- vale`. Vale skips code, so an output block the binary
# prints is never read as prose.
StylesPath = .vale
MinAlertLevel = suggestion

[{docs/**/*.md,README.md,skill/**/SKILL.md}]
BasedOnStyles = ank
ank.EntityId = NO

# The two pages a newcomer reads before holding a corpus.
[docs/{install,quickstart}.md]
ank.EntityId = YES
