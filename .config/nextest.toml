# cargo-nextest runs the suite for the `cargo-test` verifier and the CI `test`
# job (ADR-8c12a38531e3): one pool for every test of every binary, so the
# binaries no longer wait for each other.

# Eight suites of ank-tui open pseudo-terminals, and they run one at a time:
# under `cargo test` through the in-process `terminal::ONE_AT_A_TIME` lock, and
# here, where every test is its own process and that lock serialises nothing,
# through this group. The lock was first taken because `ptsname(3)` answered out
# of a static buffer (LOG-3b0bc419c884); `pty::open` reads the slave with
# `ptsname_r` now (TASK-adea229723df), and that is not why the group stays.
# With the group and the lock removed, the `cargo nextest run --workspace --profile ci` step on macos-latest
# never finished, in run 39060806985 (head 21c9e74, 46 minutes until a push
# superseded it) and run 39064235334 (head 8c1954e, 30 minutes until
# cancelled), while ubuntu-latest and windows-latest passed both and main's
# macOS leg passes in about 7 minutes. A third head, 4dda9b9, hung the same way
# with the group back: the hang was the new test's, whose threads waited at a
# barrier for ever once one open failed. So the removal was never measured on
# macOS, and the group stays on every platform until it is. The suites
# are modules of the one `integration` target (TASK-22af5b0918a4), so they are
# named by test path and not by binary.
[test-groups]
pty-serial = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'package(ank-tui) & binary(integration) & test(/^(bindings|claims|colour|edit|graph|overlay|search|verbs)::/)'
test-group = 'pty-serial'

# The pseudo-terminal test prints every open it had to retry, with its errno,
# and its output is shown on success too: a refusal macOS recovered from is a
# fact read off the job log, not one the passing test swallows
# (TASK-adea229723df).
[[profile.default.overrides]]
filter = 'package(ank-tui) & binary(integration) & test(=terminal::every_terminal_opened_at_once_is_told_its_own_slave)'
success-output = 'immediate'

# CI runs every test to the end: whether a failure is one platform's or every
# platform's is the information a run is for, as `fail-fast: false` already says
# for the matrix.
[profile.ci]
fail-fast = false

# A test still running after ten minutes is killed and counted as a failure,
# so a hang turns its leg red within the bound plus the suite instead of holding
# the job to GitHub's six-hour limit: on 2026-10-17 the macOS leg of PR #640 sat
# 46, 30 and 26 minutes in this step across three heads and was cancelled by
# hand each time (TASK-8cb5af6607f5). nextest prints SLOW every `period` and
# terminates at `period` times `terminate-after`: 60s times 10, a bound of 600s.
# The slowest honest test, measured from the five green runs of main
# 39059985353 to 39068855928, is
# `cli::a_failing_verifier_answers_as_it_would_sequentially_and_leaves_nothing_running`
# on windows-latest at 327.623s (about 20s in the other three runs); the
# 1000-process scratch-root test,
# `scratch::tests::a_root_is_locked_before_a_sibling_sweep_can_see_its_lock_file`,
# took at most 54.325s on windows-latest and 61.582s on macos-latest. The
# twenty-round cold-readers test below, landed after that measurement, passed
# in 335.911s on windows-latest in run 39073429275 of its pull request (274.110s
# in 39071205082; 103-189s on ubuntu and macos), and is now the slowest pass
# seen. The bound is 1.8 times it; under 336s it would have turned that green
# run red.
slow-timeout = { period = "60s", terminate-after = 10 }

# The cold-readers test runs twenty rounds under CI and prints one line per
# round (TASK-4a819896815a); shown on a pass, so the count is in the job log.
[[profile.ci.overrides]]
filter = 'package(ank-cli) & binary(integration) & test(=cli::concurrent_readers_of_a_cold_corpus_of_this_size_all_answer)'
success-output = "final"

# DIAGNOSTIC (TASK-5f45090a418b), not for merge.
[[profile.ci.overrides]]
filter = 'package(ank-cli) & binary(integration) & test(=cli::cold_readers_wait_for_a_writer_that_outlasts_the_busy_wall)'
success-output = "final"
slow-timeout = { period = "60s", terminate-after = 30 }
