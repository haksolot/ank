[package]
name = "ank-tui"
# ank-cli's version, and not a version of its own. This crate is linked into
# the `ank` binary rather than shipped beside it, so "which ank is this" has one
# answer and this number is not a second one.
version = "0.6.0"
edition = "2021"
# The workspace floor, for the reason ank-core's manifest gives: one lockfile,
# one build.
rust-version = "1.95"
# Apache-2.0, like the whole tree (ADR-9f03438f5422).
license = "Apache-2.0"
description = "The Ank terminal reader: it draws what the CLI prints, and reaches the corpus only by running it."

# **The dependency list is the constraint made mechanical** (ADR-8bd76e8d7c4e,
# ADR-559eebf5c6f5). `ank-core` is absent and must stay absent, and so is every
# git library: this crate reaches the corpus by running `ank ... --json` and by
# nothing else, so the refusals it shows are the refusals the binary gave and
# there is no second dispatch path to keep in step. `tests/dependencies.rs`
# reads the graph back out of cargo and fails when either arrives, holds this
# list to what is declared below, and reads the sources for the `extern` block
# ADR-559eebf5c6f5 forbids on any platform.
[dependencies]
# The exit codes, read out of the contract rather than typed as numbers
# (ADR-6fd69efb629c). This is what `ank-daemon` takes from it and for the same
# reason: this crate dispatches no verb, so the verb table is not its business.
ank-contract = { path = "../ank-contract" }
# **The two the decision spends, and the whole of what they buy**
# (ADR-559eebf5c6f5). The reader is a full-screen application: raw mode, the
# alternate buffer, a keystroke, a resize, mouse events including the wheel,
# and one full-screen region with a scrollbar over it.
# Every one of those is two implementations of one behaviour -- `tcsetattr` and
# `SetConsoleMode`, an `ioctl` and a console call, a byte and a key record --
# and CLAUDE.md's rule is that OS-dependent behaviour is not verified until it
# has run on all three platforms. crossterm *is* that implementation, so what
# this crate spends is a dependency and not an `extern` block: `tests/
# dependencies.rs` reads back out of the sources that none arrived.
#
# **The number, written here rather than left for whoever runs `cargo tree`.**
# This crate compiled 15 crates before and compiles 82 now. The workspace
# lockfile went from 50 entries to 200, and the two counts differ because a
# lockfile carries a package whether or not a feature enables it: the termion
# and termwiz backends, `palette` and their trees are locked and never built.
# Fifty-five is what this was priced at when the two were taken, and it is what
# ratatui 0.29 costs by the same instrument; 0.30 is 8 crates more compiled than
# that, and it is the current release rather than a major this project would owe
# an upgrade.
#
# The default features are off and four are named. `all-widgets` and
# `widget-calendar` are what they buy back: this reader draws no calendar, and
# §13 spends a dependency only on necessity. `layout-cache` is what makes the
# solver's answer cheap enough to ask for at every paint *and* while a key is
# being answered, which `view.rs` does deliberately so that the heading over a
# window and the rows inside it are one arithmetic.
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }
ratatui = { version = "0.30", default-features = false, features = ["std", "crossterm", "layout-cache", "underline-color"] }
# **The CLI's `--json` has to be *read*, and this is what reads it.**
# `ank-contract::json` writes and does not read, so something here has to.
#
# **What this replaces, and why the replacement is worth a crate.** This was
# `serde_yaml`, on the argument that YAML 1.2 is a superset of JSON and a crate
# already in the tree four times over costs nothing more. The argument is true
# about the grammar and was the wrong instrument all the same: `ank find --json`
# answers this corpus with 216 KB, every byte of which is JSON, and a YAML
# reader arrives at it through a resolver that has to decide whether `yes` is a
# boolean, whether `2026-08-25` is a timestamp and whether `TASK-0001` opens a
# tag -- questions the document's own language does not ask. §13 spends a
# dependency only on necessity, and reading a language with a parser for that
# language is the necessity: the alternative to this crate is not the previous
# crate, it is a JSON reader written in this tree, which would be a second
# reading of `ank_contract::json`'s escaping convention to keep in step with the
# first. serde_json is the neutral referee between the two sides, and `serde`,
# which it brings, is already a workspace dependency pinned at `=1.0.210`.
# `preserve_order` is not decoration. `view.rs::answered` draws a document's own
# fields "in the order it wrote them", which is what lets a person check a
# screen against the bytes the CLI printed; serde_json's default map is sorted,
# and the feature is what keeps that sentence true. It costs `indexmap` and its
# two, all three of which this workspace's lockfile already carries.
serde_json = { version = "1", features = ["preserve_order"] }
