[package]
name = "ank-contract"
version = "0.3.0"
edition = "2021"
# The workspace floor, for the reason ank-core's manifest gives: this crate has
# no dependencies at all and would compile on far less, but the workspace
# resolves one lockfile and builds as a unit.
rust-version = "1.95"
# Apache-2.0, like the whole tree (ADR-534c7a3e6cf8).
#
# This crate was the first to carry it, a day before the rest, and the argument
# it was given then is worth keeping because it is the argument that moved the
# boundary: a tool that reads a corpus and wants its exit codes typed would have
# had to become GPL to say `error[7]` correctly, and there is no mechanism in
# here to defend anyway -- `const` data and two enums, the description of an
# interface. That reasoning applied to the format crate the day before, and to
# the tool the day after, which is how a line redrawn twice in one direction
# turned out to be a line in the wrong place.
license = "Apache-2.0"
authors = ["Sean Lamet"]
description = "The Ank machine contract: the verb table, the refusals and the exit codes, consumed by every surface."

# Deliberately none, and this is load-bearing rather than tidy. Every surface
# consumes this crate (ADR-6fd69efb629c), so anything it depends on is depended
# on by all of them at once. What it holds is `const` data and two enums; a
# dependency here would buy nothing and cost every consumer.
[dependencies]
