[package]
name = "ankor-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "Parseur et modele de donnees du format Ankor. Le format est la spec ; ce crate en est l'implementation de reference."

[dependencies]
serde = { version = "=1.0.210", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "1"
globset = "0.4"
sha2 = "0.10"
hex = "0.4"
