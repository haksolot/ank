[package]
name = "ank-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "The Ank CLI: agent surface (7 verbs) and human surface."

[[bin]]
name = "ank"
path = "src/main.rs"

[dependencies]
ank-core = { path = "../ank-core" }
# Already in the tree through ank-core: no new crate enters here.
# config.yml is the only YAML the CLI reads itself; sha2 and hex are the
# index's content hash per file, which decides what needs reindexing (§6).
serde = { version = "=1.0.210", features = ["derive"] }
serde_yaml = "0.9"
sha2 = "0.10"
hex = "0.4"

# The one real dependency of this crate, and the specification asks for it by
# name (§6, §12): the index is SQLite, and `find` is FTS5. `bundled` compiles
# SQLite from source rather than linking the system library — that is what
# keeps a static binary static, and Windows ships no libsqlite3 to link
# against. The price is a C compiler at build time on the three platforms.
#
# On the MSRV: neither rusqlite 0.40 nor libsqlite3-sys 0.38 declares a
# rust-version, and this lockfile was resolved by a 1.95 toolchain, so whether
# it still builds under the 1.75 the pin used to assume is unknown rather than
# known-broken — no 1.75 toolchain has been run against it. Stated as unknown
# on purpose: a comment claiming otherwise would be a guess, and CI pins
# nothing below stable today.
#
# `default-features = false` is not tidiness: the default set includes
# `ffi-sqlite-wasm-rs`, which drags wasm-bindgen, js-sys and a wasm VFS into the
# lockfile of a native CLI. They are target-gated and never compile here, but
# they are supply-chain surface all the same, and this crate has no wasm target.
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
