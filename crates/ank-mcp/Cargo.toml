[package]
name = "ank-mcp"
# **Internal, and nobody is ever told this number** (TASK-ae64d1c5678d). It read
# `ank-cli's version, and not a version of its own` while there were two files
# in one archive and a caller holding both had to know which number described
# the pair. There is one file (ADR-1ea31c2f3c5a), so there is no pair, and
# check-version.sh stopped holding this literal to the tag along with the rest of
# the machinery for the second executable.
#
# What outlived that reason is that the number went on leaving the process: a
# client read it in `serverInfo` and every claim taken through the surface was
# written under `ank-mcp/<it>`. Both now report the version the dispatch hands
# down, which is the binary's -- so this literal describes a library nothing
# publishes, is gated by nothing, and is free to move or not move for the
# reasons a crate version exists. `crates/ank-mcp/src/lib.rs` states the choice
# where it is made, and `crates/ank-cli/tests/mcp.rs` holds the surface to it
# through the binary.
version = "0.6.0"
edition = "2021"
# The workspace floor, for the reason ank-core's manifest gives: one lockfile,
# one build.
rust-version = "1.95"
# Apache-2.0, like the whole tree (ADR-534c7a3e6cf8).
license = "Apache-2.0"
authors = ["Sean Lamet"]
description = "The Ank protocol surface: every verb the CLI dispatches, over MCP, generated from one table."

# **A library, and no `[[bin]]`** (ADR-fd98f4bc6dea). The surface is the verb
# `ank mcp`, so this crate is linked into the one executable every route carries
# rather than shipped beside it -- the same shape `ank-tui` has, and folded for
# the same reason ADR-8bd76e8d7c4e gave there: a separate file is invisible to
# precisely the people it exists for, and has to be distributed, documented and
# discovered as a third thing.
#
# Declared rather than left to convention, because the absence of a second
# executable is the thing this task changed and a reader looking for it should
# find a statement and not a missing section.
[lib]
name = "ank_mcp"
path = "src/lib.rs"

[dependencies]
# The table this surface is generated from, and the writer it shares with the
# CLI (ADR-6fd69efb629c). A verb the table does not carry is a verb neither
# surface has, which is the whole condition ADR-fd98f4bc6dea carries forward.
ank-contract = { path = "../ank-contract" }
# **No new crate enters the tree for this.** JSON-RPC has to be *read*, and
# nothing here wrote a parser before: `ank-contract::json` writes and does not
# read. `serde_yaml` is already a dependency of `ank-core` and `ank-cli`, and
# YAML 1.2 is a superset of JSON, so a request on one line parses as flow YAML.
# §13 spends a dependency only on necessity, and the same reasoning already
# carries the conformance test that reads the JSON goldens.
serde_yaml = "0.9"
