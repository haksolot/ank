[package]
name = "ankor-cli"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "CLI Ankor : surface agent (7 verbes) et surface humaine."

[[bin]]
name = "ankor"
path = "src/main.rs"

[dependencies]
ankor-core = { path = "../ankor-core" }
# Deja dans l'arbre via ankor-core : aucune caisse nouvelle n'entre ici.
# config.yml est le seul YAML que le CLI lit lui-meme.
serde = { version = "=1.0.210", features = ["derive"] }
serde_yaml = "0.9"
