name: ci

# `push` on the default branch and nowhere else, because every other push is
# already answered: main takes no direct push, so a commit arrives through a
# pull request and `pull_request` is the event that tests it. Listening to both
# ran each workflow twice per commit, which cost no money on a public repository
# and cost a reader every listing: `gh pr checks` printed twenty-four rows where
# twelve say the same thing, in pairs pointing at different runs.
#
# What this gives up is CI on a branch pushed with no pull request open, which
# is worth naming: that branch now gets its first answer when the pull request
# exists. `attest` is unaffected and still fires, it already asked for a push on
# the default branch.
on:
  push:
    branches: [main]
  pull_request:

# Read-only: this workflow publishes nothing. Artifacts and tags are the
# perimeter of release.yml (TASK-b8c9d0e1f2a3).
permissions:
  contents: read

# One run per ref, and the two halves are not symmetric. A pull request that is
# pushed again has nothing to learn from the run it superseded, so that one is
# cancelled. The default branch is queued instead, never cancelled, because
# `attest` writes `refs/ank/proof/*` and two of them racing is exactly how an
# intermediate merge commit goes red while the head of main is green: whichever
# run got there first recorded the proofs and the other found them taken. Serial
# runs on main make that race impossible rather than tolerable.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Without fail-fast, a failure on one platform does not cancel the other
      # two. Knowing whether a defect is OS-specific or general is exactly the
      # information we come here for: development happens on a single platform.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # `ank check` walks history: it asks where a dead scope went, and reads a
      # ratification commit to verify a frozen constraint. The default depth-1
      # checkout carries no history to answer either, so the job would report
      # that it cannot verify and verify nothing -- green and empty, which is a
      # worse failure than the red it replaces (TASK-2ce5554d6ed0).
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # `actions/cache` and not one of the Rust cache actions, for the reason
      # the next comment gives about toolchains: a first-party action is the
      # same trust as the checkout above, where a third-party one would be a new
      # dependency in the supply chain for something GitHub already ships. The
      # key is the lockfile, so a dependency change misses on purpose, and the
      # restore-key falls back to the last build of this OS rather than to none.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-test-

      # The Rust toolchain preinstalled on the runners is enough, rustfmt
      # included. A third-party toolchain action would be one more dependency
      # in the supply chain, for a need the image already covers.
      - name: versions
        run: |
          rustc --version
          cargo --version
          git --version

      # The checkout applies .gitattributes: on windows-latest, .ank/ must come
      # out in LF. This is the step that would have caught the CRLF bug, and
      # `ank check` below is what proves it.
      - name: line endings in .ank/
        shell: bash
        run: |
          # One file is exempt, and it is exempt in .gitattributes too: the CRLF
          # golden's content is its line endings. It is checked in the opposite
          # direction just below.
          crlf_fixture=TASK-c71f0e5a9b23.md
          if grep -rlU $'\r' --exclude="$crlf_fixture" .ank/ crates/ank-core/tests/golden/; then
            echo "CRLF found: .gitattributes was not applied"
            exit 1
          fi
          echo "LF everywhere"

          # And the exemption has to still work. If git normalises the fixture
          # on checkout, the CRLF test passes while testing nothing, so the
          # absence of a carriage return here is the failure.
          if ! grep -qU $'\r' "crates/ank-core/tests/golden/valid/$crlf_fixture"; then
            echo "the CRLF fixture lost its carriage returns: check .gitattributes"
            exit 1
          fi
          echo "CRLF fixture intact"

      - run: cargo fmt --check

      - run: cargo test --workspace

      # The tool validates its own corpus with its own command. This is the same
      # line as the `check-repo` verifier in .ank/config.yml, and it has to stay
      # the same line: a CI that checks .ank/ differently from `ank done` would
      # let a corpus pass one and fail the other.
      #
      # Exit 8 means findings, and that is a failure here. Signals exit 0.
      - run: cargo run -q --bin ank -- check

      # The binary the step above just built, kept for `attest`. That job used
      # to run `cargo run` of its own and spend nine minutes, the most expensive
      # job in this file, rebuilding what this one had compiled two hundred
      # seconds earlier. One platform is enough: `attest` runs on ubuntu.
      #
      # A day, because nothing reads this after the run that made it.
      - name: the binary this run built
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: ank-ubuntu
          path: target/debug/ank
          retention-days: 1
          if-no-files-found: error

  # `done` records what ran on the machine that ran it. That is a local claim,
  # and `check` says so on the default branch: "done with no test proof: nothing
  # external anchors it". Ten tasks in this corpus carried that signal, each one
  # a run that went green and was never written down, and the answer is not for
  # an agent to copy a run id by hand into `done` -- it is for the run itself to
  # say what it proved (TASK-2dff950e5d51).
  #
  # `check` is the work list, and no diff of `.ank/` is computed here. The signal
  # is gated on the task appearing done on the default branch, deliberately: on a
  # feature branch straight after `done` no run has happened yet, so there is
  # nothing to anchor and this job finds nothing to do. On the push that merges
  # it, the same signal names exactly what landed.
  #
  # After the matrix and never inside it: an attestation is only meaningful once
  # the tests pass, and one per leg would grow three identical proofs per task.
  #
  # `push`, and on the default branch. A pull_request event runs on a merge
  # commit that no branch carries, and a fork's token cannot push a ref -- which
  # would fail this job for a reason about the event rather than about the
  # corpus.
  #
  # The branch condition restates a gate that already lives in `check`, and that
  # is worth naming rather than hiding: on a feature branch the signal does not
  # fire, so this job would build the binary for two minutes to be told there is
  # nothing to do, on every push. If ank ever reports unanchored tasks off the
  # default branch, this line is what stops the pipeline from noticing.
  attest:
    name: attest / ubuntu-latest
    needs: [test, version-check, msrv, msrv-tight]
    if: >-
      github.event_name == 'push' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    # The one job here that writes, and it writes refs/ank/proof/* and nothing
    # else: `--detached` produces no commit, so the branch is never touched.
    permissions:
      contents: write

    steps:
      # History, for the same reason as the test job: this one reads `ank check
      # --json` to decide what to anchor, and a check that cannot walk history
      # answers about a corpus it could not fully read.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The binary the test job built, rather than one this job compiles. It
      # `needs` that job, so the artefact exists whenever this runs, and the two
      # cannot disagree about what they are attesting: it is the same file.
      - uses: actions/download-artifact@v4
        with:
          name: ank-ubuntu
          path: ${{ runner.temp }}/bin

      - name: the binary is the one the tests ran
        run: |
          chmod +x "$RUNNER_TEMP/bin/ank"
          "$RUNNER_TEMP/bin/ank" --version

      - name: the tasks this run anchors
        id: unanchored
        run: |
          code=0
          out=$("$RUNNER_TEMP/bin/ank" check --json) || code=$?
          # The contract, and the whole of it: 8 is findings, 9 is the
          # environment. Both are red here, and 9 says which so nobody goes
          # looking for a broken corpus.
          case $code in
            0) ;;
            8) echo "ank check: findings, see the test job"; exit 1 ;;
            9) echo "ank check: environment unavailable, not a corpus failure"; exit 2 ;;
            *) echo "ank check: unexpected exit $code"; exit 1 ;;
          esac
          ids=$(printf '%s' "$out" | jq -r '
            .findings[]
            | select(.message | startswith("done with no test proof"))
            | .subject')
          echo "$ids"
          {
            echo "ids<<EOF"
            echo "$ids"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # The exit code, like every other step here. `attest --detached` produces
      # a ref and nothing else, so a push that did not land leaves nothing worth
      # having and the verb says so with code 9 (ADR-af533e7a3e03). The loop
      # runs every id before failing: one unreachable push is not a reason to
      # leave the rest of the run unanchored.
      #
      # `--json` stays because the run log is where a human reads what was
      # anchored to what. Nothing parses it any more.
      - name: anchor them on this run
        env:
          IDS: ${{ steps.unanchored.outputs.ids }}
          ANK_AGENT: process:github-actions
        run: |
          if [ -z "$(printf '%s' "$IDS" | tr -d '[:space:]')" ]; then
            echo "nothing to anchor: every finished task already carries a test proof"
            exit 0
          fi
          failed=0
          for id in $IDS; do
            "$RUNNER_TEMP/bin/ank" attest "$id" \
              --proof "test:$GITHUB_RUN_ID" --detached --json || failed=1
          done
          [ "$failed" -eq 0 ]

      # `--detached` writes a ref and no file. A working tree that moved would
      # mean the proof landed in the corpus instead, which is a commit this job
      # must never need.
      - name: the working tree did not move
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "attest wrote to the working tree; --detached must not:"
            git status --porcelain
            exit 1
          fi
          echo "clean: the attestation is a ref, not a commit"

  # release.yml refuses to build when the tag and the manifests disagree on the
  # version, and it exercises that check against fixtures before trusting it.
  # Both run on a tag or a dispatch and nowhere else, which left the check itself
  # untested between releases: an edit to check-version.sh, or to the shape of
  # any of the seven manifests it parses, was only discovered by the run it was
  # supposed to gate — and by then the tag is spent (TASK-adf11c12c480).
  #
  # The fixtures alone, never the comparison. A push carries no tag, so there is
  # no version to hold the manifests to, and a check that invented one would be
  # red on every branch between releases.
  #
  # That is not a gap: the first fixture reads the version out of
  # crates/ank-cli/Cargo.toml and holds every other literal to it, so a bump that
  # touched six files out of seven is red here, on the branch that made it.
  #
  # One platform, and ubuntu because it is the platform of use: the version job
  # in release.yml runs there, and a rehearsal on an OS the check never runs on
  # rehearses nothing. Windows would also need .gitattributes to keep these
  # scripts in LF, which is a decision about the tree rather than about this job.
  version-check:
    name: version check / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: the version check refuses what it should refuse
        run: bash .github/scripts/check-version-fixtures.sh

  # The MSRV declared in the manifests, built on the toolchain it names. The
  # job above runs on whatever the runner image ships, which is what lets an
  # MSRV claim rot in silence: it was wrong by seventeen minor versions before
  # anyone ran the number (TASK-daf25ab8a9b7).
  #
  # All three platforms, because the crate that sets the floor sets it from a
  # build script, and a build script is the one place where the floor can
  # legitimately differ per target.
  #
  # The number is not a target held on purpose: it is what libsqlite3-sys 0.38
  # needs. Pinning back to a version that needs less was measured and rejected
  # in ank-cli's manifest (TASK-973e9dc3f9ce). This job is the whole enforcement
  # — when the floor moves, it moves here first, in red.
  #
  # The number carried here is read from the manifests, never written. It used
  # to appear literally in the job name and in both commands, so bumping
  # `rust-version` left this job installing and building a toolchain the tree no
  # longer declared — green, and measuring the wrong thing. That is the same rot
  # this job exists to prevent, one level up (TASK-3b085be1bf6a).
  #
  # No number in the name either: a job name is evaluated before any step runs,
  # so it cannot read a step output, and a name that has to be edited by hand is
  # the defect again. The `versions` step is what says which toolchain ran.
  #
  # `shell: bash` throughout because this matrix includes windows-latest, where
  # the default shell is pwsh: `$DECLARED` is a PowerShell variable there and an
  # environment variable is `$env:DECLARED`, so a bare `run:` would expand to
  # nothing and install a toolchain with an empty name.
  msrv:
    name: msrv / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      - name: the declared MSRV
        id: floor
        shell: bash
        run: |
          read_floor() {
            sed -n 's/^rust-version *= *"\([0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' "$1" | head -1
          }
          cli=$(read_floor crates/ank-cli/Cargo.toml)
          core=$(read_floor crates/ank-core/Cargo.toml)
          if [ -z "$cli" ] || [ -z "$core" ]; then
            echo "no rust-version in crates/ank-cli/Cargo.toml or crates/ank-core/Cargo.toml"
            exit 9
          fi
          # Both manifests declare it independently and nothing else compares
          # them. Reading one and trusting the other is only correct while they
          # agree, so the disagreement is made to fail rather than assumed away.
          if [ "$cli" != "$core" ]; then
            echo "::error::the manifests disagree on rust-version"
            echo "  crates/ank-cli/Cargo.toml:  $cli"
            echo "  crates/ank-core/Cargo.toml: $core"
            echo "The floor is one number for the workspace. Make them agree."
            exit 9
          fi
          echo "declared=$cli" >> "$GITHUB_OUTPUT"
          echo "declared $cli, in both manifests"

      # rustup is preinstalled on the runners, so pinning costs no new action
      # and no new supply-chain surface — the same argument the job above makes
      # for using the image's toolchain.
      - name: install the declared MSRV
        shell: bash
        env:
          DECLARED: ${{ steps.floor.outputs.declared }}
        run: rustup toolchain install "$DECLARED" --profile minimal

      - name: versions
        shell: bash
        env:
          DECLARED: ${{ steps.floor.outputs.declared }}
        run: cargo +"$DECLARED" --version

      # --locked because the lockfile is half the claim: lockfile v4 needs 1.78
      # on its own, and a resolution performed here would measure a different
      # tree from the one that ships.
      # Keyed on the declared MSRV as well as the lockfile: each toolchain
      # compiles its own artefacts, and a cache shared between them would hand a
      # job objects the compiler it runs cannot read. `msrv is tight` below is
      # deliberately left uncached, because its job is to prove that a build
      # FAILS and a restored `target` is the one thing that could make it pass.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-msrv-${{ steps.floor.outputs.declared }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-msrv-

      - name: build on the declared MSRV
        shell: bash
        env:
          DECLARED: ${{ steps.floor.outputs.declared }}
        run: cargo +"$DECLARED" build --workspace --locked

  # The job above proves the declared MSRV is *sufficient*. Nothing proved it
  # was *tight*, and the asymmetry is the one TASK-daf25ab8a9b7 corrected in the
  # other direction: an MSRV asserted and never run rots in silence. The floor
  # comes from one build script in libsqlite3-sys, so the day that crate stops
  # calling `cfg_select!` — or the day the dependency is replaced — the declared
  # number becomes higher than the tree needs, every job stays green, and the
  # only signal is that nobody can build ank on a toolchain that would have
  # worked.
  #
  # This is a negative test, and negative tests fail for free: a build that dies
  # of a network hiccup or a missing C compiler "passes" a naive check while
  # proving nothing. So the failure is attributed by two independent gates
  # rather than merely observed.
  #
  #  1. A positive control. `ank-core` alone has no C dependency and builds on
  #     the previous minor. If *that* fails, the toolchain, the network or the
  #     registry is broken, and this job says so instead of reporting a floor.
  #  2. The workspace failure has to carry a rustc diagnostic code. That is what
  #     separates "the compiler rejected this tree" from "the environment fell
  #     over": cargo's own infrastructure errors and a missing `cc` produce
  #     `error: failed to ...` with no code.
  #
  # Deliberately not pinned to `E0658`, the code the floor currently produces.
  # Pinning it would break the day the floor moves for another reason — exactly
  # the event this job exists to notice — and it would go red pointing at the
  # wrong cause. ADR: the floor is a consequence of a dependency, not a target.
  #
  # One platform, and ubuntu because it is the cheapest that can falsify the
  # claim: the number is one per workspace, and `cfg_select!` is a rustc feature
  # gate, so it fires the same on all three. If a floor ever does differ per
  # target, the job above runs the matrix and is what catches the disagreement —
  # this one only ever says "look again", never "lower it for me".
  msrv-tight:
    name: msrv is tight / ubuntu-latest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Read from the manifest rather than written here. A number in two places
      # is a number that will disagree with itself, and re-measuring means
      # re-running the walk, never editing a constant.
      - name: the minor below the declared MSRV
        id: floor
        run: |
          declared=$(sed -n 's/^rust-version *= *"\([0-9][0-9]*\.[0-9][0-9]*\)".*/\1/p' \
            crates/ank-cli/Cargo.toml | head -1)
          if [ -z "$declared" ]; then
            echo "no rust-version found in crates/ank-cli/Cargo.toml"
            exit 9
          fi
          prev="${declared%%.*}.$(( ${declared#*.} - 1 ))"
          echo "declared=$declared" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"
          echo "declared $declared, testing $prev"

      # A toolchain that has not shipped is an environment failure and never a
      # passing check: without this step its absence would make the build below
      # fail, which is what the job is looking for, and the check would pass
      # while measuring nothing at all.
      # Through the environment rather than interpolated into the script. The
      # value is `[0-9]+\.[0-9]+` by construction above, so nothing here is
      # injectable — this is the habit, not the fix for a live hole.
      - name: install the previous minor
        env:
          PREV: ${{ steps.floor.outputs.prev }}
        run: |
          rustup toolchain install "$PREV" --profile minimal \
            || { echo "rustup has no $PREV: environment, not a result"; exit 9; }
          cargo +"$PREV" --version \
            || { echo "toolchain installed but unusable: environment, not a result"; exit 9; }

      - name: positive control on the same toolchain
        env:
          PREV: ${{ steps.floor.outputs.prev }}
        run: |
          cargo +"$PREV" build -p ank-core --locked --ignore-rust-version \
            || {
              echo "ank-core does not build on $PREV."
              echo "That is the toolchain, the network or the registry, not the MSRV:"
              echo "the failure below would have been unattributable, so this job stops here."
              exit 9
            }

      - name: the declared MSRV must be the lowest that works
        env:
          DECLARED: ${{ steps.floor.outputs.declared }}
          PREV: ${{ steps.floor.outputs.prev }}
        run: |
          set +e
          out=$(cargo +"$PREV" build --workspace --locked --ignore-rust-version 2>&1)
          code=$?
          set -e
          echo "$out"

          if [ "$code" -eq 0 ]; then
            echo "::error::the declared MSRV $DECLARED is higher than this tree needs"
            echo "$PREV builds the whole workspace. Re-walk before lowering it:"
            echo "  cargo +$PREV build --workspace --locked --ignore-rust-version"
            echo "then set rust-version in crates/ank-cli/Cargo.toml and"
            echo "crates/ank-core/Cargo.toml to the lowest minor that builds and"
            echo "passes the suite, and update the pin in this workflow."
            exit 1
          fi

          if ! printf '%s' "$out" | grep -q 'error\[E[0-9]'; then
            echo "::error::$PREV failed, but not with a compiler diagnostic"
            echo "The positive control passed, so the toolchain works. A failure"
            echo "carrying no error[E....] is not evidence the floor is real:"
            echo "read the output above before trusting this number."
            exit 9
          fi

          echo "$PREV is refused by the compiler, so $DECLARED is tight:"
          printf '%s' "$out" | grep -o 'error\[E[0-9]*\]' | sort -u
