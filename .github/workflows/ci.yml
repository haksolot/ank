name: ci

on:
  push:
  pull_request:

# Read-only: this workflow publishes nothing. Artifacts and tags are the
# perimeter of release.yml (TASK-b8c9d0e1f2a3).
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Without fail-fast, a failure on one platform does not cancel the other
      # two. Knowing whether a defect is OS-specific or general is exactly the
      # information we come here for: development happens on a single platform.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # The Rust toolchain preinstalled on the runners is enough, rustfmt
      # included. A third-party toolchain action would be one more dependency
      # in the supply chain, for a need the image already covers.
      - name: versions
        run: |
          rustc --version
          cargo --version
          git --version

      # The checkout applies .gitattributes: on windows-latest, .ank/ must come
      # out in LF. This is the step that would have caught the CRLF bug, and
      # check_repo below is what proves it.
      - name: line endings in .ank/
        shell: bash
        run: |
          if grep -rlU $'\r' .ank/ crates/ank-core/tests/golden/; then
            echo "CRLF found: .gitattributes was not applied"
            exit 1
          fi
          echo "LF everywhere"

      - run: cargo fmt --check

      - run: cargo test --workspace

      - run: cargo run --example check_repo
