name: ci

on:
  push:
  pull_request:

# Read-only: this workflow publishes nothing. Artifacts and tags are the
# perimeter of release.yml (TASK-b8c9d0e1f2a3).
permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Without fail-fast, a failure on one platform does not cancel the other
      # two. Knowing whether a defect is OS-specific or general is exactly the
      # information we come here for: development happens on a single platform.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v5

      # The Rust toolchain preinstalled on the runners is enough, rustfmt
      # included. A third-party toolchain action would be one more dependency
      # in the supply chain, for a need the image already covers.
      - name: versions
        run: |
          rustc --version
          cargo --version
          git --version

      # The checkout applies .gitattributes: on windows-latest, .ank/ must come
      # out in LF. This is the step that would have caught the CRLF bug, and
      # `ank check` below is what proves it.
      - name: line endings in .ank/
        shell: bash
        run: |
          # One file is exempt, and it is exempt in .gitattributes too: the CRLF
          # golden's content is its line endings. It is checked in the opposite
          # direction just below.
          crlf_fixture=TASK-c71f0e5a9b23.md
          if grep -rlU $'\r' --exclude="$crlf_fixture" .ank/ crates/ank-core/tests/golden/; then
            echo "CRLF found: .gitattributes was not applied"
            exit 1
          fi
          echo "LF everywhere"

          # And the exemption has to still work. If git normalises the fixture
          # on checkout, the CRLF test passes while testing nothing, so the
          # absence of a carriage return here is the failure.
          if ! grep -qU $'\r' "crates/ank-core/tests/golden/valid/$crlf_fixture"; then
            echo "the CRLF fixture lost its carriage returns: check .gitattributes"
            exit 1
          fi
          echo "CRLF fixture intact"

      - run: cargo fmt --check

      - run: cargo test --workspace

      # The tool validates its own corpus with its own command. This is the same
      # line as the `check-repo` verifier in .ank/config.yml, and it has to stay
      # the same line: a CI that checks .ank/ differently from `ank done` would
      # let a corpus pass one and fail the other.
      #
      # Exit 8 means findings, and that is a failure here. Signals exit 0.
      - run: cargo run -q --bin ank -- check
