name: release

# Publishing happens on a tag and only on a tag: a release that could be
# produced from a branch would make "the binary for v0.1.0" a question rather
# than an answer.
#
# `workflow_dispatch` builds the same four binaries and publishes nothing. The
# alternative is discovering that the release pipeline is broken at the moment
# you use it, on a tag you then have to delete -- and a tag is the one thing
# here that is awkward to take back.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read everywhere, including the job that publishes. The release is created
# under RELEASE_TOKEN and not under the default token (see `publish` below), so
# there is no job left in this workflow whose `GITHUB_TOKEN` can write: the one
# write capability here is a secret named in one step's `env`, and `build` --
# the job that runs code from the tree on four machines -- cannot reach it.
permissions:
  contents: read

jobs:
  # The tag is the only source of the published version: the archive names, the
  # npm packages and the release title all derive from `$GITHUB_REF_NAME`, and
  # nothing compares it with the version compiled into the binary. So a tag
  # pushed without bumping the manifests ships artefacts that agree with each
  # other and disagree with what they contain, and the npm smoke job cannot see
  # it -- it compares the artefact with itself, deliberately, which tests the
  # wrapper and not the version.
  #
  # It runs before the build and gates it, because the point is to refuse to
  # publish: a check at the end has already spent the matrix, and the tag is
  # the one thing here that is awkward to take back.
  version:
    name: version
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # The positive control, first. This job exists to be red on a day nobody
      # is watching it, and the failure that costs a tag is a check that passes
      # when it should not -- so the check is exercised against fixtures where
      # it must refuse before its verdict on the tree is worth anything.
      - name: the check refuses what it should refuse
        shell: bash
        run: bash .github/scripts/check-version-fixtures.sh

      # `GITHUB_REF_TYPE` and not the `v*` pattern the packaging step matches
      # on: a dispatch runs from a branch, and what makes the comparison
      # impossible is the absence of a tag rather than the shape of a name.
      - name: the tag and the manifests agree
        shell: bash
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE:-branch}" != "tag" ]; then
            echo "no tag on this run: there is no version to compare the manifests with."
            echo "skipped, and a dispatch publishes nothing."
            exit 0
          fi
          bash .github/scripts/check-version.sh "${GITHUB_REF_NAME#v}"

      # Checked here rather than in `publish`, for the reason the job itself
      # exists: a credential missing at the end has already spent the matrix,
      # and the release would then either fail with the tag gone or -- worse --
      # succeed under the default token and start nothing. The secret is never
      # printed; `-n` on a masked value tests presence and reveals nothing.
      - name: the release credential is present
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        shell: bash
        run: |
          set -e
          if [ "${GITHUB_REF_TYPE:-branch}" != "tag" ]; then
            echo "no tag on this run: nothing will be published, so nothing needs the token."
            exit 0
          fi
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "RELEASE_TOKEN is not set on this repository."
            echo "the release would be created under the default token, and GitHub starts"
            echo "no workflow run from an event that token produced -- so publish-brew,"
            echo "publish-scoop, publish-apt and publish-winget would never fire."
            echo
            echo "  gh secret set RELEASE_TOKEN"
            echo
            echo "a fine-grained PAT on this repository, Contents: write, and nothing else."
            exit 1
          fi
          echo "RELEASE_TOKEN is set."

  build:
    name: ${{ matrix.os }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      # A missing platform is the information we came for. Without fail-fast,
      # a tag that breaks macOS still tells us Linux and Windows are fine.
      fail-fast: false
      matrix:
        include:
          # musl, not gnu: `bundled` compiles SQLite from source precisely so
          # the binary carries it, and glibc is then the only thing left
          # tethering it to the machine that built it. A gnu build on
          # ubuntu-latest refuses to start on any older distro.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          # An Intel runner, not `--target x86_64-apple-darwin` on the arm64
          # one: this job tests before it packages, and a cross-compiled binary
          # gets tested either not at all or through a translation layer nobody
          # downloading it is running. Half the Mac install base is what the row
          # is for, and a row that only linked would ship exactly the untested
          # file the test step below refuses to call a release.
          #
          # The label is version-pinned where its siblings are `-latest`
          # because there is no Intel `-latest` to take: `macos-13` was the
          # last one and was retired in December 2025. `macos-15-intel` is the
          # standard image GitHub named as its replacement, and the last x86_64
          # image Actions will offer -- it goes away in August 2027, and this
          # row goes with it rather than quietly moving to another arm64
          # runner.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip

    steps:
      - uses: actions/checkout@v5

      - name: versions
        shell: bash
        run: |
          rustc --version
          cargo --version
          git --version

      # musl needs its own std and its own C compiler, and `bundled` means
      # there is C to compile. Both are absent from the image by default.
      - name: musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      # The criterion asks for the suite on every target, not only for a build
      # that links. A binary nobody tested is not a release, it is a file.
      - name: test
        run: cargo test --workspace --target ${{ matrix.target }}

      - name: build
        run: cargo build --release --bin ank --target ${{ matrix.target }}

      # Named for what it runs on, because that is the question someone
      # downloading it is asking.
      - name: package
        shell: bash
        run: |
          # On a dispatch there is no tag, so the name says so rather than
          # inventing a version the artefact does not carry.
          case "$GITHUB_REF_NAME" in
            v*) version="${GITHUB_REF_NAME#v}" ;;
            *)  version="0.0.0-dispatch+$(git rev-parse --short HEAD 2>/dev/null || echo dev)" ;;
          esac
          name="ank-${version}-${{ matrix.target }}"
          mkdir -p "dist/${name}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            cp "target/${{ matrix.target }}/release/ank.exe" "dist/${name}/"
          else
            cp "target/${{ matrix.target }}/release/ank" "dist/${name}/"
          fi
          cp README.md LICENSE "dist/${name}/"
          cp skill/SKILL.md "dist/${name}/"
          cd dist
          if [ "${{ matrix.archive }}" = "zip" ]; then
            7z a "${name}.zip" "${name}" > /dev/null
          else
            tar czf "${name}.tar.gz" "${name}"
          fi
          # Checksums travel with the artefact: the release page is not a
          # trusted channel, and a hash the publisher computed elsewhere is
          # not a check anyone can repeat.
          if [ "${{ matrix.archive }}" = "zip" ]; then
            sha256sum "${name}.zip" > "${name}.zip.sha256"
          else
            sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          fi

      # The loose binary travels beside the archives, for the npm packages
      # below: extracting a .zip would need `unzip`, which the Windows runner's
      # bash does not have, and building a second time to avoid that would be
      # two binaries where the point is one.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.sha256
            dist/*/ank
            dist/*/ank.exe
          if-no-files-found: error

  # The npm channel exists for the workstation whose firewall blocks downloading
  # a bare executable but lets the registry through, so the binaries travel
  # inside the platform packages and nothing is fetched at install time
  # (npm/README.md). This job proves that on the machine that will run it.
  npm-smoke:
    name: npm ${{ matrix.os }}
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            package: ank-linux-x64-musl
          - os: macos-latest
            target: aarch64-apple-darwin
            package: ank-darwin-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            package: ank-win32-x64

    steps:
      - uses: actions/checkout@v5
      # Pinned rather than inherited: `engines` declares node 18, and a channel
      # that works on one runner's default and not another's is the kind of
      # thing this job exists to catch before a tag does.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.target }}
          path: dist

      # The node version is pinned above; the npm inside it is not, and that is
      # the one that moved. npm 11 refuses to publish a prerelease, or a version
      # below the one already on the registry, without an explicit --tag, where
      # npm 10 applied "latest" silently -- so this job passed on the runner's
      # bundled npm while the same command failed on a maintainer's machine.
      # Taking the newest npm in both jobs makes the rehearsal use the npm the
      # publish will use, and makes the next tightening of these rules turn a
      # dispatch red instead of a tag.
      - name: npm
        shell: bash
        run: |
          npm install -g npm@latest
          npm --version

      # Assembling and testing on the same OS is the point: an install that
      # works on Linux says nothing about the .cmd shim npm writes on Windows,
      # and a wrapper is exactly the kind of code that is right on one platform
      # and wrong on another.
      - name: assemble
        shell: bash
        run: bash .github/scripts/npm-assemble.sh "0.0.0-smoke" "${{ matrix.package }}"

      # The wrapper is also the pi package, and a pi package is its skills: with
      # skills/ank/SKILL.md missing, `pi install npm:@haksolot/ank` installs a
      # binary and teaches nothing, while every other assertion in this job
      # still passes. The copies are made at assembly time and never committed
      # (npm-assemble.sh), so nothing else in the repository can notice one went
      # missing. Read out of the tarball rather than off the disk, because the
      # tarball is what the registry receives -- a `files` entry that stopped
      # matching would leave the file on disk and out of the package.
      #
      # Every skill, not only the contract (ADR-91b77f036884): an install that
      # receives `ank` and none of `ank-plan`, `ank-drift`, `ank-loop` teaches
      # the rules and none of the activities. The list is walked from the tree
      # rather than written here, so a skill added later is checked by existing,
      # and the count is asserted so that a walk finding nothing cannot pass as
      # a walk finding everything.
      - name: the wrapper carries every skill
        shell: bash
        run: |
          set -e
          tgz=$(ls npm/ank/*.tgz | head -n 1)
          checked=0
          for src in skill/SKILL.md skill/*/SKILL.md; do
            [ -f "$src" ] || continue
            name=$(sed -n 's/^name:[[:space:]]*//p' "$src" | head -n 1)
            packed=$(tar -xzOf "$tgz" "package/skills/${name}/SKILL.md" | sha256sum | cut -d' ' -f1)
            source=$(sha256sum "$src" | cut -d' ' -f1)
            echo "  ${name}: packed $packed"
            echo "  ${name}: source $source"
            test "$packed" = "$source"
            checked=$((checked + 1))
          done
          echo "$checked skills carried"
          test "$checked" -ge 4

      # The argument publish-npm passes, run on every dispatch and every tag,
      # with the one flag that stops short of the registry. This is the step
      # that was missing when v0.1.2 shipped no packages: the smoke job proved
      # the tarballs install, but it reached them through globs that expand to
      # real files, and `npm pack` runs from inside the directory. Nothing
      # anywhere gave npm the path itself, which is precisely the argument that
      # was wrong -- a bare `npm/ank` is a GitHub shorthand to npm, not a
      # folder. Tested here because a publish is not something you get to
      # retry: the tag is spent whether or not the registry accepted it.
      #
      # The derivation of §9, exercised on both of its branches before anything
      # publishes. This is the half a dry-run cannot reach: the smoke job
      # assembles one version, so the publish below rehearses one branch, and
      # the branch it does not take is the one that would put a release
      # candidate on every machine running a bare install.
      - name: a prerelease resolves to next and a release to latest
        shell: bash
        run: |
          set -e
          check() {
            got=$(bash .github/scripts/npm-dist-tag.sh "$1")
            echo "$1 -> $got"
            test "$got" = "$2"
          }
          check 0.2.0 latest
          check 1.0.0 latest
          check 0.2.0-rc1 next
          check 1.0.0-beta.1 next
          check 0.0.0-smoke next
          # Build metadata is not a prerelease identifier, and a hyphen inside
          # it says nothing about the version in front of it.
          check 1.2.3+build latest
          check 1.2.3+build-7 latest

      # The argument publish-npm passes, run on every dispatch and every tag,
      # with the one flag that stops short of the registry. This is the step
      # that was missing when v0.1.2 shipped no packages: the smoke job proved
      # the tarballs install, but it reached them through globs that expand to
      # real files, and `npm pack` runs from inside the directory. Nothing
      # anywhere gave npm the path itself, which is precisely the argument that
      # was wrong -- a bare `npm/ank` is a GitHub shorthand to npm, not a
      # folder. Tested here because a publish is not something you get to
      # retry: the tag is spent whether or not the registry accepted it.
      #
      # `--tag` is derived, not written: publish-npm computes it from the same
      # script on the same input shape, so the two cannot drift into passing
      # different flags. npm 11 refuses to guess a dist-tag, which is what made
      # the implicit `latest` of npm 10 visible enough to be worth deciding.
      - name: the publish argument is a path
        shell: bash
        run: |
          set -e
          tag=$(bash .github/scripts/npm-dist-tag.sh "0.0.0-smoke")
          echo "dist-tag: $tag"
          npm publish --dry-run --access public --tag "$tag" "./npm/${{ matrix.package }}"
          npm publish --dry-run --access public --tag "$tag" "./npm/ank"

      - name: install from the tarballs
        shell: bash
        run: |
          mkdir -p smoke && cd smoke
          npm init -y > /dev/null
          npm install --no-audit --no-fund \
            "../npm/${{ matrix.package }}/"*.tgz "../npm/ank/"*.tgz

      # The criterion in as many words: the same line as the release binary.
      # Compared against the artefact itself rather than against a literal, so
      # the assertion cannot drift from the version it ships.
      - name: npx answers like the binary
        shell: bash
        run: |
          set -e
          direct=$(find dist -type f \( -name 'ank' -o -name 'ank.exe' \) | head -n 1)
          chmod +x "$direct" 2>/dev/null || true
          expected=$("$direct" --version)
          actual=$(cd smoke && npx ank --version)
          echo "binary: $expected"
          echo "npx:    $actual"
          test "$expected" = "$actual"

      # The exit codes carry meaning (section 4) and a wrapper is where they go
      # to die. An unknown verb is a 2, and 2 rather than 1 is the point: a
      # wrapper collapsing every failure into "it failed" would still pass a
      # test that only asked for non-zero. It also needs no repository, so what
      # is under test is the wrapper and not the fixture.
      - name: the exit code survives the wrapper
        shell: bash
        run: |
          cd smoke
          npx ank --version > /dev/null
          set +e
          npx ank help nosuchverb
          code=$?
          set -e
          echo "an unknown verb exited $code"
          test "$code" -eq 2

  publish-npm:
    # Only on a tag, and only once all three smoke tests agree. Publishing is
    # the one step here that cannot be taken back.
    needs: npm-smoke
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The same npm the smoke job rehearsed on. A rehearsal against one npm and
      # a publish against another rehearses nothing, and the publish is the step
      # that cannot be taken back.
      - name: npm
        shell: bash
        run: |
          npm install -g npm@latest
          npm --version

      - name: assemble
        shell: bash
        run: bash .github/scripts/npm-assemble.sh "${GITHUB_REF_NAME#v}"

      # The platform packages first: the wrapper pins them exactly, so a
      # wrapper on the registry ahead of its binaries is an install that
      # resolves to nothing.
      #
      # `./npm/$p` and not `npm/$p`: to npm, a bare `a/b` is a GitHub shorthand
      # before it is a directory, so `npm/ank` sent v0.1.2 to
      # ssh://git@github.com/npm/ank.git and the job died at the first package.
      # The leading `./` is what makes it a path.
      #
      # `--tag` is derived from the version and from nothing else (§9): `latest`
      # for a release, `next` for a prerelease. So `v0.2.0-rc1` is installable
      # by whoever asks for it by name and never becomes what a bare
      # `npm install @haksolot/ank` resolves to. The smoke job reads the same
      # script, which is what keeps the rehearsal rehearsing: a flag chosen here
      # and not there would be a publish nobody had tried.
      - name: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          tag=$(bash .github/scripts/npm-dist-tag.sh "$version")
          echo "publishing $version under $tag"
          for p in ank-linux-x64-musl ank-darwin-arm64 ank-win32-x64 ank; do
            npm publish --access public --tag "$tag" "./npm/$p"
          done

  publish:
    # Only after every row. A release carrying three targets out of four would
    # be worse than no release: it looks complete.
    #
    # `build` and not `npm-smoke`, deliberately: the release page is the primary
    # channel and npm is a convenience on top of it, so a broken wrapper costs
    # the npm packages and not the release. The reverse would hold the binaries
    # hostage to a JavaScript shim.
    needs: build
    # And only for a tag. A dispatch run builds and stops there.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # No `contents: write`, deliberately, where this job used to carry it: the
    # release is created under RELEASE_TOKEN, so the default token in this job
    # has nothing left to write with. Granting it write as well would leave a
    # capability nothing uses.

    steps:
      # Checked out for one file: the dist-tag derivation of §9, which decides
      # whether this release is a prerelease. Reading it is what stops a second
      # copy of the rule existing here -- two channels reading one tag
      # differently is how a reader ends up trusting whichever they opened.
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # `gh` is on the runner already. A third-party release action would be
      # one more supply-chain dependency for a call this short -- the same
      # reasoning that keeps a toolchain action out of ci.yml.
      # `RELEASE_TOKEN` and not `github.token`, which is the whole of
      # TASK-2078ab116f63: GitHub does not start a workflow run from an event
      # the default token produced -- the rule that stops a workflow triggering
      # itself. So a release created under it publishes eight files and starts
      # none of publish-brew, publish-scoop, publish-apt or publish-winget,
      # which is what happened on v0.3.0 and had to be undone by hand with a
      # draft toggle from the maintainer's own token. Those four trigger only on
      # `release: published`, and only a credential that is not the default one
      # produces that event.
      #
      # A fine-grained PAT scoped to this repository with `Contents: write`.
      # The `version` job refuses the tag when it is missing, so this step is
      # never reached without it and never falls back to the default token: a
      # fallback would republish the exact defect, silently and green.
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          # The same version read the same way npm reads it, so the release page
          # and the registry cannot disagree about what this tag is.
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          if [ "$(bash .github/scripts/npm-dist-tag.sh "$version")" = "next" ]; then
            prerelease="--prerelease"
          fi
          echo "publishing $GITHUB_REF_NAME ${prerelease:---release}"
          # Named globs, not dist/*: the artefacts now also carry the loose
          # binary the npm packages are built from, in a directory, and
          # `gh release create` takes files.
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            $prerelease \
            dist/*.tar.gz dist/*.zip dist/*.sha256

  # The release's only product downstream of this workflow is four runs, and
  # until now their absence was invisible: v0.3.0 was green end to end while
  # none of the four had started. So the run that publishes is also the run that
  # says whether publishing reached anything -- the same shape as ADR-af53, a
  # write whose only product is elsewhere failing when it does not arrive.
  #
  # It cannot undo the release and does not try to: the tag is spent either way.
  # What it changes is that the next time the trigger breaks, a red release run
  # names it on the day it happens instead of a channel being noticed months
  # later at the version it stopped at.
  channels:
    name: channels
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # `actions: read` is what listing runs needs, and it is the only thing this
    # job reads. It publishes nothing, so it holds no write of any kind.
    permissions:
      contents: read
      actions: read

    steps:
      # The criterion of TASK-2078ab116f63 in as many words: one run each of the
      # four, whose event is `release`, on this tag.
      #
      # Asked as three `gh run list` filters rather than as one `--jq`
      # expression over the whole listing. Both would answer, and only one can
      # be exercised anywhere but here: `--workflow`, `--event` and `--branch`
      # are flags with fixtures behind them, where a jq program filtering on
      # `.event` is a string this file would be the first and only place to run.
      # `--branch` takes the tag: a `release` event runs at the ref it
      # published, which is the same fact TASK-1674d5b73761 recorded from the
      # other side.
      #
      # `--workflow <file>.yml` and not the display name: the file name is what
      # this repository controls, and a `name:` renamed upstairs would make this
      # job green by looking for a workflow that no longer exists.
      #
      # Polled rather than read once: GitHub queues the four asynchronously and
      # `gh release create` returns before they appear. Five minutes is far past
      # what queuing costs and well short of anything a human would wait for.
      - name: the four channels started on this release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -e
          expected="publish-brew publish-scoop publish-apt publish-winget"
          deadline=$((SECONDS + 300))
          while :; do
            missing=""
            for w in $expected; do
              # `[]` and not an empty string: gh prints an empty JSON array when
              # nothing matches, and a `--json` that failed would print nothing
              # at all -- so comparing against `[]` cannot read a broken call as
              # a run that started.
              found=$(gh run list --workflow "$w.yml" --event release \
                --branch "$GITHUB_REF_NAME" --limit 1 --json databaseId)
              if [ "$found" = "[]" ]; then
                missing="$missing $w"
              fi
            done
            if [ -z "$missing" ]; then
              echo "all four started on $GITHUB_REF_NAME with event=release."
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "missing after $((SECONDS))s:$missing"
              echo
              # Which of the two failures this is. A run that started on the
              # wrong ref and a run that never started are the same silence
              # through the filters above, and they have opposite fixes -- one
              # is this file, the other is the token. So the same question is
              # asked once more without `--branch`, as a diagnostic and never as
              # a verdict: the criterion is about runs on this tag.
              for w in $missing; do
                anywhere=$(gh run list --workflow "$w.yml" --event release \
                  --limit 1 --json databaseId)
                if [ "$anywhere" = "[]" ]; then
                  echo "  $w: no release-event run at all"
                else
                  echo "  $w: a release-event run exists but not on $GITHUB_REF_NAME"
                fi
              done
              echo
              echo "the release was published and the channels it exists to feed did not run."
              echo "the usual cause is the release having been created under the default token,"
              echo "which starts no workflow run at all. check that the secret the publish job"
              echo "above reads is a fine-grained PAT on this repository with Contents: write:"
              echo
              echo "  gh secret list"
              echo "  gh run view $GITHUB_RUN_ID --log"
              exit 1
            fi
            echo "waiting on:$missing"
            sleep 15
          done
