name: publish-scoop

# A Scoop bucket is any git repository carrying a `bucket/` directory, so this
# repository is its own bucket and no satellite exists to keep in step
# (ADR-782a3556cf2d, carrying ADR-e3cb36646d77 forward).
#
# `bucket/ank.json` is therefore a derived file that happens to be committed,
# and the whole design of this workflow follows from that: the derivation lives
# in one step, a release runs it and commits the result, and every other run
# runs it and asserts the committed file is exactly what it produced. A hand
# edit turns this workflow red rather than failing on somebody's machine.
on:
  release:
    types: [published]
  # The manifest and this file are the only inputs, so they are the only paths
  # worth spending a Windows runner on.
  pull_request:
    paths:
      - "bucket/**"
      - ".github/workflows/publish-scoop.yml"
  push:
    branches: [main]
    paths:
      - "bucket/**"
      - ".github/workflows/publish-scoop.yml"
  workflow_dispatch:

permissions:
  contents: read

# Two releases rewriting the same file on the default branch would race, and
# the loser would push a manifest for the older tag, so every release shares
# one group. Never cancelled: a tag is not something you get to publish twice.
# Everything else is grouped by ref, because a pull request holding up another
# pull request buys nothing.
concurrency:
  group: publish-scoop-${{ github.event_name == 'release' && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  manifest:
    name: the manifest is derived
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.derive.outputs.version }}

    steps:
      # On a release the derived manifest is committed to the default branch,
      # so the checkout has to be that branch and not the tag: committing onto
      # a detached tag would produce a commit no branch contains.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}

      - name: derive
        id: derive
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail

          # A release derives the manifest for the tag it published. Every other
          # run derives it for the version the committed manifest already
          # claims, which is what makes the assertion below meaningful: the file
          # is compared with the derivation of its own version, so a hash typed
          # by hand, a URL pointing at another version, or an extract_dir that
          # drifted from the archive layout are all differences.
          if [ "$EVENT" = "release" ]; then
            version="${TAG#v}"
          else
            version=$(jq -r '.version' bucket/ank.json)
          fi
          if [ -z "$version" ] || [ "$version" = "null" ]; then
            echo "no version to derive from: the release tag and bucket/ank.json both came back empty." >&2
            exit 1
          fi
          echo "deriving the manifest for $version"

          archive="ank-${version}-x86_64-pc-windows-msvc"

          # The hash is read out of the .sha256 asset the release carries, and
          # never written into this file. A constant here is a constant that
          # goes stale one tag later, and a stale hash is the one defect that
          # shows up nowhere except on the machine of whoever runs the install.
          # `sha256sum` wrote it in binary mode, so the line is
          # "<hash> *<name>" and the hash is the first space-separated field.
          gh release download "v${version}" \
            --pattern "${archive}.zip.sha256" \
            --dir "$RUNNER_TEMP" \
            --clobber
          hash=$(cut -d' ' -f1 < "${RUNNER_TEMP}/${archive}.zip.sha256")

          # A truncated download, an HTML error page saved to disk, or a
          # checksum file that changed shape would all yield something that is
          # not a hash, and Scoop would report it as a mismatched download
          # rather than as a broken manifest. Named here instead.
          if ! printf '%s' "$hash" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "the .sha256 asset of ${archive}.zip did not yield a sha256: '${hash}'" >&2
            echo "check the asset at ${REPO_URL}/releases/tag/v${version}" >&2
            exit 1
          fi

          # `extract_dir` is the directory the archive wraps its contents in;
          # release.yml builds the zip around a directory named after the
          # archive, and Scoop would otherwise shim a path that is not there.
          cat > bucket/ank.json <<JSON
          {
              "##": "Derived from the GitHub release by .github/workflows/publish-scoop.yml, which asserts on every run that this file is exactly what deriving it produces. A hand edit turns that job red instead of failing on somebody's machine.",
              "version": "${version}",
              "description": "The stupid coordination tool: tasks and architecture decisions in your repo, behind one CLI any coding agent can call.",
              "homepage": "${REPO_URL}",
              "license": "Apache-2.0",
              "architecture": {
                  "64bit": {
                      "url": "${REPO_URL}/releases/download/v${version}/${archive}.zip",
                      "hash": "${hash}",
                      "extract_dir": "${archive}"
                  }
              },
              "bin": "ank.exe"
          }
          JSON

          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat bucket/ank.json

      # The half that runs on a pull request. Deriving a file and never
      # comparing it would leave the committed manifest unverified until the
      # next release, which is exactly one release too late.
      - name: the committed manifest is that derivation
        if: github.event_name != 'release'
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- bucket/ank.json; then
            {
              echo ""
              echo "bucket/ank.json is not what deriving it for ${{ steps.derive.outputs.version }} produces."
              echo "it is a generated file: take the diff above as the fix, or bump its version field"
              echo "to a tag that has a release."
            } >&2
            exit 1
          fi
          echo "bucket/ank.json is exactly the derivation for ${{ steps.derive.outputs.version }}"

      # The other half. Committed rather than published to a registry because
      # the bucket *is* this repository: a user's `scoop update` is a `git pull`
      # of the default branch, so the default branch is the channel.
      - name: commit it to the default branch
        if: github.event_name == 'release'
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- bucket/ank.json; then
            echo "the manifest already describes ${{ steps.derive.outputs.version }}; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/ank.json
          git commit -m "scoop: ank ${{ steps.derive.outputs.version }}"
          # The branch may have moved while the release was building. Rebasing
          # one commit that touches one generated file is safe; failing the
          # push is not, because the tag has already been spent.
          git pull --rebase origin "${{ github.event.repository.default_branch }}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}"

  # A manifest nobody installed from is a manifest nobody tested. The criterion
  # is about the binary, so this reaches it through Scoop rather than through
  # the fields of a JSON file.
  install:
    name: scoop install
    needs: manifest
    runs-on: windows-latest

    steps:
      # Unshallowed: the checkout below is pushed into a local bucket
      # repository, and git refuses to push out of a shallow clone.
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'release' && github.event.repository.default_branch || '' }}
          fetch-depth: 0

      - name: the bucket to add
        id: bucket
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_EVENT_NAME -eq 'release') {
            # The manifest job has just pushed to the default branch, so the
            # published bucket is reachable at the URL a user would type. This
            # is the full loop, and it is only provable here: on any other
            # event the manifest under test is not on the default branch yet.
            $source = "${env:GITHUB_SERVER_URL}/${env:GITHUB_REPOSITORY}"
          } else {
            # What is under test is the commit in hand, which no URL serves
            # yet. `scoop bucket add` clones whatever git URL it is given, so
            # the commit is served as one: a bare repository beside the
            # checkout is this repository at this commit, minus the network,
            # which is not the part being tested. The push is explicit because
            # a checkout can be detached and a clone follows HEAD.
            #
            # A `file:///` URL and not the bare path: `scoop bucket add` puts
            # its argument through the git-URL regex of lib/buckets.ps1 before
            # it clones anything, and a Windows path matches nothing in it --
            # "is not a valid Git URL!", the bucket silently not added, and the
            # install failing afterwards for a reason that names the manifest
            # rather than the URL. Three slashes, so the authority is empty and
            # the drive letter stays in the path. Nothing here runs under MSYS,
            # so the path conversion that mangles `file://` URLs in git-bash is
            # not in play.
            $repo = Join-Path $env:RUNNER_TEMP 'ank-bucket.git'
            git init --bare --initial-branch=main $repo
            if ($LASTEXITCODE -ne 0) { throw "git init failed" }
            git push $repo HEAD:refs/heads/main
            if ($LASTEXITCODE -ne 0) { throw "git push to the local bucket failed" }
            $source = 'file:///' + ($repo -replace '\\', '/')
          }
          "the bucket source is $source"
          "source=$source" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: scoop
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          # The runner's user is a local administrator and Scoop refuses to
          # install under one unless told that is deliberate.
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          # The installer puts the shims on the user's PATH in the registry,
          # which this process will never re-read. Later steps get it from here.
          "$env:USERPROFILE\scoop\shims" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # The install verifies the hash itself: a manifest whose `hash` does not
      # match the asset fails right here, which is the whole reason the hash is
      # derived rather than typed.
      - name: install ank from the bucket
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          scoop bucket add ank '${{ steps.bucket.outputs.source }}'
          # Asserted here rather than left to the install: a bucket scoop
          # declined to add still leaves `scoop install ank/ank` failing, but
          # it fails saying it cannot find the manifest, which sends the reader
          # after the manifest instead of after the URL.
          $manifest = "$env:USERPROFILE\scoop\buckets\ank\bucket\ank.json"
          if (-not (Test-Path $manifest)) {
            throw "scoop bucket add produced no manifest at ${manifest}: read the scoop output above"
          }
          scoop install ank/ank
          # `scoop` is a PowerShell script, so its exit code does not reliably
          # reach this one: a failed install would print in red and leave the
          # step green. The shim it was supposed to write is the assertion --
          # and the step after this one, which runs the binary, is the other.
          # `${shim}` and not `$shim`: a colon after a bare variable name makes
          # PowerShell read the whole thing as a drive-qualified variable, and
          # it is a parse error rather than a runtime one -- the step does not
          # run a single line, so nothing before it in the block runs either.
          $shim = "$env:USERPROFILE\scoop\shims\ank.exe"
          if (-not (Test-Path $shim)) {
            throw "scoop install left no shim at ${shim}: read the scoop output above"
          }

      # The criterion in as many words. `--version` prints "ank <version>
      # (<commit>, skill <hash>)", so the assertion is on the version token and
      # not on the whole line: pinning the line would make every commit of the
      # release a change to this file.
      - name: ank --version names the released version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = '${{ needs.manifest.outputs.version }}'
          $actual = (ank --version | Select-Object -First 1)
          "expected: $expected"
          "ank --version: $actual"
          if ($actual -notmatch "^ank\s+$([regex]::Escape($expected))(\s|$)") {
            throw "the installed binary does not name $expected"
          }
