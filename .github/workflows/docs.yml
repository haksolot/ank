name: docs

# The site is derived from docs/ and nothing else (ADR-33970fcdb6e8): every pull
# request builds it, so a page that breaks the book or a link is red before it
# lands, and only a push to the default branch publishes it. The build runs on
# every pull request rather than on those touching docs/, because a check that
# only sometimes exists cannot be made required.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A superseded pull request run has nothing left to say. Deployments on main are
# queued rather than cancelled, so the site always ends on the last merge.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # book.toml sets site-url to the same prefix: a project site is served under
  # /<repository>/, and the 404 page links back to it absolutely.
  SITE_PREFIX: /ank/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # The generator comes from mise.lock, which pins its version and the
      # checksum of its release archive per platform (ADR-9c69bd47ce23): a new
      # mdBook changes the site only through a pull request that changes
      # mise.toml and the lockfile together.
      #
      # mise itself is installed as ci.yml installs it: its published release
      # binary, pinned by version and by the sha256 below for each runner, read
      # from stdin and checked before it is run, without a third-party action.
      # The digests are the release's SHASUMS256.txt. A runner outside the
      # three is an environment to repair, exit 9. mdBook and python are
      # installed by name; the first mise x then installs nextest and node too,
      # since it resolves every tool mise.toml declares, each from the lockfile.
      # The link check runs mise's python, never the runner's own, and the step
      # prints which interpreter that is. The token lets mise read the
      # release's attestation under the authenticated rate limit instead of the
      # runner's shared one.
      - name: mise
        shell: bash
        env:
          MISE_VERSION: 2026.10.17
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          case "$RUNNER_OS-$RUNNER_ARCH" in
            Linux-X64)
              asset=linux-x64
              sha=fe6dd17e68e09682b31d2e7bb7bb755d22636ac1af5d94621e300f2ca9e9fe8a ;;
            macOS-ARM64)
              asset=macos-arm64
              sha=9e27709db5eb1e900d83149418d3067309f2a5004d4994d94246ab658ba4a3ce ;;
            Windows-X64)
              asset=windows-x64.zip
              sha=32bcfda5f72bf7cb189e18ba93c2798bffcb4a678fd004e3127780363f2d8c8c ;;
            *)
              echo "no mise digest pinned for $RUNNER_OS-$RUNNER_ARCH"
              exit 9 ;;
          esac
          dir="$RUNNER_TEMP/mise"
          file="$dir/mise-v$MISE_VERSION-$asset"
          mkdir -p "$dir/bin"
          curl -LsSf -o "$file" \
            "https://github.com/jdx/mise/releases/download/v$MISE_VERSION/mise-v$MISE_VERSION-$asset"
          # Read from stdin: given a name, sha256sum on windows-latest prefixes
          # its line with a backslash, because $RUNNER_TEMP is D:\a\_temp.
          if command -v sha256sum >/dev/null; then
            got=$(sha256sum < "$file" | cut -d' ' -f1)
          else
            got=$(shasum -a 256 < "$file" | cut -d' ' -f1)
          fi
          if [ "$got" != "$sha" ]; then
            echo "::error::mise-v$MISE_VERSION-$asset has sha256 $got, pinned $sha"
            exit 1
          fi
          echo "mise-v$MISE_VERSION-$asset: sha256 $got, as pinned"
          case "$asset" in
            *.zip)
              unzip -q "$file" -d "$dir"
              bin="$dir/mise/bin"
              cygpath -w "$bin" >> "$GITHUB_PATH"
              ;;
            *)
              mv "$file" "$dir/bin/mise"
              chmod +x "$dir/bin/mise"
              bin="$dir/bin"
              echo "$bin" >> "$GITHUB_PATH"
              ;;
          esac
          export PATH="$bin:$PATH"
          mise --version
          mise trust
          mise install --locked github:rust-lang/mdBook python
          mise x -- mdbook --version
          mise x -- python3 -c 'import sys; print(sys.executable, sys.version)'

      # book.toml sets create-missing = false, so a page SUMMARY.md lists and
      # docs/ lacks fails here instead of being written as an empty chapter.
      - name: Build
        run: mise x -- mdbook build

      # mdBook rewrites a link to a .md file into one to its .html and checks
      # neither. This walks the built site, where every relative href and src
      # must resolve to a file in it, and every #fragment to an id on that page.
      # A link leaving docs/ (../skill/, ../README.md) points outside the site
      # and fails too: it is written as an absolute GitHub URL instead.
      - name: Check internal links
        run: |
          mise x -- python3 - target/book "$SITE_PREFIX" <<'EOF'
          import html.parser, pathlib, sys, urllib.parse

          root, prefix = pathlib.Path(sys.argv[1]).resolve(), sys.argv[2]

          class Page(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids, self.links = set(), []

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ("id", "name"):
                      if attrs.get(key):
                          self.ids.add(attrs[key])
                  for key in ("href", "src"):
                      if attrs.get(key):
                          self.links.append(attrs[key])

          pages = {}
          for file in root.rglob("*.html"):
              pages[file] = Page()
              pages[file].feed(file.read_text(encoding="utf-8"))

          broken = 0
          for file, page in sorted(pages.items()):
              for link in page.links:
                  url = urllib.parse.urlsplit(link)
                  if url.scheme or url.netloc:
                      continue
                  path = urllib.parse.unquote(url.path)
                  if not path:
                      target = file
                  elif path.startswith(prefix):
                      target = root / path[len(prefix):]
                  elif path.startswith("/"):
                      target = None
                  else:
                      target = (file.parent / path).resolve()
                  if target is not None and target.is_dir():
                      target = target / "index.html"
                  fragment = urllib.parse.unquote(url.fragment)
                  if (
                      target is None
                      or not target.is_relative_to(root)
                      or not target.is_file()
                      or (fragment and target in pages and fragment not in pages[target].ids)
                  ):
                      print(f"::error file={file.relative_to(root)}::broken link {link}")
                      broken += 1

          print(f"{broken} broken internal link(s) in {len(pages)} page(s)")
          sys.exit(1 if broken else 0)
          EOF

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: target/book

  # The only job that writes, and only from the default branch: a pull request
  # builds and checks the site but never publishes it. The github-pages
  # environment restricts deployments to main on its own side as well.
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
