schema: 1
context_budget: 8000
claim_ttl_max: 2h
default_branch: main
verifiers:
  cargo-test:
    run: "command -v mise >/dev/null 2>&1 || { echo \"mise is not installed: https://mise.jdx.dev/installing-mise.html\" >&2; exit 127; }; mise x -- cargo-nextest nextest run --workspace"
    timeout: 20m
    default: false
    inputs: ["**", "mise.toml", "mise.lock", "rust-toolchain.toml"]
  fmt-check:
    run: cargo fmt --check
    timeout: 2m
    default: true
    inputs: ["crates/**/*.rs", "Cargo.toml", "crates/*/Cargo.toml", "rustfmt.toml", ".rustfmt.toml"]
  check-repo:
    run: cargo run -q --bin ank -- check
    timeout: 5m
  test-ank-core:
    run: "command -v mise >/dev/null 2>&1 || { echo \"mise is not installed: https://mise.jdx.dev/installing-mise.html\" >&2; exit 127; }; mise x -- cargo-nextest nextest run -p ank-core"
    inputs: ["crates/ank-core/**", "Cargo.toml", "Cargo.lock", ".config/nextest.toml", "docs/**", "mise.toml", "mise.lock", "rust-toolchain.toml"]
    timeout: 10m
    default: true
  test-ank-contract:
    run: "command -v mise >/dev/null 2>&1 || { echo \"mise is not installed: https://mise.jdx.dev/installing-mise.html\" >&2; exit 127; }; mise x -- cargo-nextest nextest run -p ank-contract"
    inputs: ["crates/ank-contract/**", "Cargo.toml", "Cargo.lock", ".config/nextest.toml", "docs/**", "mise.toml", "mise.lock", "rust-toolchain.toml"]
    timeout: 10m
    default: true
  test-ank-daemon:
    run: "command -v mise >/dev/null 2>&1 || { echo \"mise is not installed: https://mise.jdx.dev/installing-mise.html\" >&2; exit 127; }; mise x -- cargo-nextest nextest run -p ank-daemon"
    inputs: ["crates/ank-daemon/**", "crates/ank-contract/**", "Cargo.toml", "Cargo.lock", ".config/nextest.toml", "mise.toml", "mise.lock", "rust-toolchain.toml"]
    timeout: 10m
    default: true
  test-ank-mcp:
    run: "command -v mise >/dev/null 2>&1 || { echo \"mise is not installed: https://mise.jdx.dev/installing-mise.html\" >&2; exit 127; }; cargo build -q -p ank-cli --bin ank && mise x -- cargo-nextest nextest run -p ank-mcp"
    inputs: ["crates/ank-cli/**", "crates/ank-contract/**", "crates/ank-core/**", "crates/ank-daemon/**", "crates/ank-mcp/**", "crates/ank-tui/**", "Cargo.toml", "Cargo.lock", ".config/nextest.toml", "skill/**", "mise.toml", "mise.lock", "rust-toolchain.toml"]
    timeout: 10m
    default: true
  test-ank-tui:
    run: "command -v mise >/dev/null 2>&1 || { echo \"mise is not installed: https://mise.jdx.dev/installing-mise.html\" >&2; exit 127; }; cargo build -q -p ank-cli --bin ank && mise x -- cargo-nextest nextest run -p ank-tui"
    inputs: ["crates/ank-cli/**", "crates/ank-contract/**", "crates/ank-core/**", "crates/ank-daemon/**", "crates/ank-mcp/**", "crates/ank-tui/**", "Cargo.toml", "Cargo.lock", ".config/nextest.toml", "skill/**", "mise.toml", "mise.lock", "rust-toolchain.toml"]
    timeout: 10m
    default: true
  test-ank-cli:
    run: "command -v mise >/dev/null 2>&1 || { echo \"mise is not installed: https://mise.jdx.dev/installing-mise.html\" >&2; exit 127; }; mise x -- cargo-nextest nextest run -p ank-cli"
    inputs: ["**", "mise.toml", "mise.lock", "rust-toolchain.toml"]
    timeout: 20m
    default: true
  bench-test:
    run: python3 -m unittest discover -s bench -t .
    timeout: 5m
    inputs: ["bench/**"]
roles:
  agent:
    can: [context, find, claim, log, done, new:task, new:adr:proposed]
    cannot: [adr:accept, adr:edit-constraint, task:close, delete]
  human:
    can: ["*"]
identities: {}
signers:
  sean.lamet@dekrow.com:
    keys:
      - key: gpg 739A603FB05F9F2F7D3C8D50624FCFCC1482554A
        note: |-
          Keys allowed to ratify (section 8).

          This repository signs with GPG, so `git verify-commit` resolves the signature
          through the keyring and never reads this file: git consults an allowed-signers
          file only under `gpg.format = ssh`. The entry below is therefore a declaration
          and not a mechanism. It records which identity may ratify, in a versioned file
          where adding one is a diff in review, and enforcement stays advisory in the
          sense section 8 already accepts and displays. Switching `gpg.format` to ssh
          and pointing `gpg.ssh.allowedSignersFile` here is what would make it
          load-bearing, and that trade was weighed and declined: it would change the
          signature of every commit in the repository, not only the ratifications.

          A second key was declared on 2026-08-18: an ssh key held on the maintainer's
          VPS, where the gpg key above is not. `ank check` reads this file itself and
          judges whichever key signed against it, so the declaration is load-bearing
          for ank whatever the format. git's own `verify-commit` is unchanged: it
          resolves the gpg entry through the keyring, and would need
          `gpg.ssh.allowedSignersFile` pointed here to judge the ssh one. The trade
          declined above is still declined -- nothing here changes the signature of
          ordinary commits.

          A third key was declared on 2026-09-19: an ssh key held on the maintainer's
          laptop (omarchy), used for signing only. The same reading as the VPS key
          holds: ank check judges it against this file, git's verify-commit does not.

          A fourth key was declared on 2026-10-11: the omarchy laptop was reinstalled
          and its private key is gone, so a new ssh key was generated there. The third
          key stays declared: ratifications it signed are judged against this file,
          and removing it would turn each of them into a fault.

          Layout follows git's allowed-signers file: principal, then the key.
      - key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIERwF3UDr0Cf26Xg5fxAtxqzmV67AK72bnw2s8I3QGI6
      - key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJc+kNks9S696Iggm8C5E/s3JvoM37y++wp3HbpZK4ul
      - key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIG8vpx9mvyO3dOdzNvweB+3FeChVsMktpzpXmFO+v50r
