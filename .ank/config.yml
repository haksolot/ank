schema: 1
context_budget: 8000
claim_ttl_max: 2h
default_branch: main
verifiers:
  cargo-test:
    run: cargo test --workspace -q
    timeout: 10m
    default: true
  fmt-check:
    run: cargo fmt --check
    timeout: 2m
    default: true
  check-repo:
    run: cargo run -q --bin ank -- check
    timeout: 5m
roles:
  agent:
    can: [context, find, claim, log, done, new:task, new:adr:proposed]
    cannot: [adr:accept, adr:edit-constraint, task:close, delete]
  human:
    can: ["*"]
identities: {}
